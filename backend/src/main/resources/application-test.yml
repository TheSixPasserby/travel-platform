# 仅用于测试 profile：数据库名必须由 DB_TEST_NAME 显式提供，绝不回退到 DB_NAME，
# 避免集成测试误连开发库。启动器需在测试 JVM 中同时注入 DB_NAME 与 DB_TEST_NAME。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_TEST_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:travel_app}
    password: ${DB_PASSWORD}

sa-token:
  is-print: false

logging:
  level:
    # Avoid SQL bind-parameter logging, including fixture password hashes.
    com.example.travelplatform: INFO

travel:
  ai:
    settings-file: ${AI_SETTINGS_TEST_FILE:${java.io.tmpdir}/travel-ai-test-${random.uuid}.json}
