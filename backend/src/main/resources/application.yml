server:
  forward-headers-strategy: none
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: 8MB

spring:
  application:
    name: travel-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:travel_platform}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:travel_app}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
      fail-on-ignored-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

sa-token:
  token-name: satoken
  timeout: 86400
  is-concurrent: true
  is-share: false
  is-log: false
  is-read-header: true
  is-read-cookie: false
  is-read-body: false

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/swagger-ui.html
    disable-swagger-default-url: true

travel:
  ip:
    trusted-proxies: ${IP_TRUSTED_PROXIES:}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:custom}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:5}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:45}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:6000}
    response-format: ${AI_RESPONSE_FORMAT:auto}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
