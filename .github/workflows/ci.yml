name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=ephemeral_ci_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: travel_platform_ci
      DB_TEST_NAME: travel_platform_ci_test
      DB_USERNAME: root
      DB_PASSWORD: ephemeral_ci_password
      AI_ENABLED: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - name: Initialize disposable CI databases
        env:
          MYSQL_PWD: ephemeral_ci_password
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root -e "CREATE DATABASE travel_platform_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; CREATE DATABASE travel_platform_ci_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          mysql --host=127.0.0.1 --port=3306 --user=root --database=travel_platform_ci_test < database/schema.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --database=travel_platform_ci_test < database/seed.sql
      - run: npm --prefix frontend ci
      - run: python3 scripts/backend.py package
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npm --prefix mobile ci
      - run: npm --prefix mobile run type-check
      - run: npm --prefix mobile run check:safety
      - run: npm --prefix mobile run build:h5
      - run: npm --prefix mobile run build:mp-weixin
      - run: npm --prefix mobile run build:app
      - run: python3 -m unittest discover -s scripts/tests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/surefire-reports/*.txt
